# `docker compose up -d --build` chạy TADSS (localhost:8081) + ngrok (URL công khai xem ở http://localhost:4040, đổi mỗi lần khởi động lại) + Grafana (localhost:3001, dashboard "TADSS Runtime" nạp sẵn; TADSS gửi trace/metric/log tới Grafana qua OTLP).
# Cần trước: src/TADSS.Runtime.Api/appsettings.Development.json có API key riêng thật (file được copy vào image, image chỉ dùng local, không push registry),
#            .env (mẫu .env.example) có NGROK_AUTHTOKEN, và mạng: docker network create smashcourt-network
# Hướng dẫn chi tiết: README mục "Chạy bằng Docker và expose qua ngrok".
name: tadss

services:
  tadss-runtime:
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:8081:8080"   # chỉ máy này truy cập được
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      Tadss__Security__TrustForwardedHeaders: "true"
      Tadss__Database__ApplyMigrationsOnStartup: "false"   # không bao giờ tự migrate Neon
      Tadss__Telemetry__Enabled: "true"
      Tadss__Telemetry__OtlpEndpoint: http://grafana:4317   # service grafana trong cùng mạng compose
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/health/live"]
      interval: 5s
      retries: 20
    networks:
      - smashcourt-network

  ngrok:
    image: ngrok/ngrok:3.39.11-alpine
    restart: unless-stopped
    command: http tadss-runtime:8080
    environment:
      NGROK_AUTHTOKEN: ${NGROK_AUTHTOKEN}
    ports:
      - "127.0.0.1:4040:4040"   # trang theo dõi của ngrok
    depends_on:
      tadss-runtime:
        condition: service_healthy
    networks:
      - smashcourt-network

  grafana:
    image: grafana/otel-lgtm:0.34.0
    restart: unless-stopped
    ports:
      - "127.0.0.1:3001:3000"   # Grafana
      - "127.0.0.1:4317:4317"   # OTLP gRPC
      - "127.0.0.1:4318:4318"   # OTLP HTTP
    volumes:
      # Chỉ đọc: cấu hình provisioning (file, để không che các file provisioning có sẵn của otel-lgtm) và thư mục dashboard; không chứa secret
      - ./docker/grafana/provisioning/dashboards/tadss.yaml:/otel-lgtm/grafana/conf/provisioning/dashboards/tadss.yaml:ro
      - ./docker/grafana/dashboards:/otel-lgtm/tadss-dashboards:ro
    networks:
      - smashcourt-network

networks:
  smashcourt-network:
    external: true
