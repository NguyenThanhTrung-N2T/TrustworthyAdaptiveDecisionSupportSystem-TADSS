# Proxy cân bằng tải của stack đánh giá (SCALE-2): round-robin giữa hai instance TADSS. Chỉ nghe cổng 8080 trong mạng compose, không publish ra máy chủ.
worker_processes auto;
pid /tmp/nginx.pid;

events {
    worker_connections 4096;
}

http {
    access_log off;
    error_log /dev/stderr warn;

    upstream tadss {
        server eval-tadss-1:8080;
        server eval-tadss-2:8080;
        keepalive 64;
    }

    server {
        listen 8080;

        location / {
            proxy_pass http://tadss;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 30s;
        }
    }
}
