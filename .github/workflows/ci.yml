name: TADSS Runtime CI

on:
  push:
    branches: [master, develop]
  pull_request:
    branches: [master, develop]

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  build-and-test:
    name: Build, Run Tests & Verify Docker
    runs-on: ubuntu-latest

    steps:
      # 1. Lấy mã nguồn
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Cài đặt .NET SDK 8.0
      - name: Setup .NET SDK 8.0
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      # 3. Khôi phục dependencies ở chế độ locked-mode: packages.lock.json lệch đồ thị phụ thuộc thì job đỏ (SEC-7)
      - name: Restore Dependencies (locked mode)
        run: dotnet restore --locked-mode

      # 3b. Quét package có lỗ hổng (kể cả bắc cầu); mức High/Critical hoặc lỗi quét thì job đỏ (SEC-7)
      - name: Check Vulnerable Packages
        run: bash tools/ci/check-vulnerable-packages.sh

      # 4. Build toàn bộ Solution (Release mode)
      - name: Build Solution
        run: dotnet build --no-restore --configuration Release

      # 5a. Unit test (không cần Docker)
      - name: Run Unit Tests
        run: >
          dotnet test tests/TADSS.UnitTests/TADSS.UnitTests.csproj
          --no-build
          --configuration Release
          --verbosity normal
          --logger "GitHubActions"
          --logger "trx;LogFilePrefix=unit"
          --collect:"XPlat Code Coverage"
          --results-directory ./TestResults

      # 5b. Integration test trên PostgreSQL/Redis/Toxiproxy thật (Testcontainers dùng Docker có sẵn của runner)
      - name: Run Integration Tests (Testcontainers)
        run: >
          dotnet test tests/TADSS.IntegrationTests/TADSS.IntegrationTests.csproj
          --no-build
          --configuration Release
          --verbosity normal
          --logger "GitHubActions"
          --logger "trx;LogFilePrefix=integration"
          --collect:"XPlat Code Coverage"
          --results-directory ./TestResults

      # 6. Tạo bảng tổng hợp kết quả Test hiển thị trực tiếp lên GitHub Action Summary
      - name: Publish Test Results Summary
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: Unit & Integration Tests Report
          path: "TestResults/**/*.trx"
          reporter: dotnet-trx
          fail-on-error: true

      # 7. Lưu trữ file Artifacts phục vụ xem xét sau này
      - name: Upload Test Results Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-and-coverage
          path: ./TestResults

      # 8. Chỉ đóng gói thử Docker Image NẾU VÀ CHỈ NẾU tất cả Tests đều PASS
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Verify Docker Image Packaging
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          load: true
          tags: tadss-runtime:ci-test

      # 9. SEC-6: image phải chạy bằng user non-root (Config.User không rỗng, không phải root/0)
      - name: Verify Container Runs As Non-Root
        run: |
          user="$(docker inspect --format '{{.Config.User}}' tadss-runtime:ci-test)"
          echo "Config.User = '${user}'"
          if [ -z "${user}" ] || [ "${user}" = "root" ] || [ "${user}" = "0" ] || [[ "${user}" == 0:* ]] || [[ "${user}" == root:* ]]; then
            echo "Image chạy bằng root (Config.User='${user}')" >&2
            exit 1
          fi
