name: TADSS Runtime CI

on:
  push:
    branches: [master, develop]
  pull_request:
    branches: [master, develop]

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  build-and-test:
    name: Build, Run Tests & Verify Docker
    runs-on: ubuntu-latest

    steps:
      # 1. Lấy mã nguồn
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Cài đặt .NET SDK 8.0
      - name: Setup .NET SDK 8.0
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      # 3. Khôi phục dependencies ở chế độ locked-mode: packages.lock.json lệch đồ thị phụ thuộc thì job đỏ (SEC-7)
      - name: Restore Dependencies (locked mode)
        run: dotnet restore --locked-mode

      # 3b. Quét package có lỗ hổng (kể cả bắc cầu); mức High/Critical hoặc lỗi quét thì job đỏ (SEC-7)
      - name: Check Vulnerable Packages
        run: bash tools/ci/check-vulnerable-packages.sh

      # 4. Build toàn bộ Solution (Release mode)
      - name: Build Solution
        run: dotnet build --no-restore --configuration Release --warnaserror

      # 5a. Unit test (không cần Docker). TADSS_CATALOG_INDEX_DIR: xuất chỉ mục test → mã vào artifact cho dashboard "Kiểm thử" (perf/board.py ci tadss)
      - name: Run Unit Tests
        env:
          TADSS_CATALOG_INDEX_DIR: ${{ github.workspace }}/TestResults
        run: >
          dotnet test tests/TADSS.UnitTests/TADSS.UnitTests.csproj
          --no-build
          --configuration Release
          --verbosity normal
          --logger "GitHubActions"
          --logger "trx;LogFilePrefix=unit"
          --collect:"XPlat Code Coverage"
          --results-directory ./TestResults

      # 5b. Integration test trên PostgreSQL/Redis/Toxiproxy thật (Testcontainers dùng Docker có sẵn của runner)
      - name: Run Integration Tests (Testcontainers)
        env:
          TADSS_CATALOG_INDEX_DIR: ${{ github.workspace }}/TestResults
        run: >
          dotnet test tests/TADSS.IntegrationTests/TADSS.IntegrationTests.csproj
          --no-build
          --configuration Release
          --verbosity normal
          --logger "GitHubActions"
          --logger "trx;LogFilePrefix=integration"
          --collect:"XPlat Code Coverage"
          --results-directory ./TestResults

      # 6. Tạo bảng tổng hợp kết quả Test hiển thị trực tiếp lên GitHub Action Summary
      - name: Publish Test Results Summary
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: Unit & Integration Tests Report
          path: "TestResults/**/*.trx"
          reporter: dotnet-trx
          fail-on-error: true

      # 7. Lưu trữ file Artifacts phục vụ xem xét sau này
      - name: Upload Test Results Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-and-coverage
          path: ./TestResults

  # Epic 6C (6C-2a): build image MỘT lần ⇒ kiểm (OPS-01 không file bí mật, OPS-02/SEC-6 non-root, nhãn revision = sha) ⇒ đẩy đúng image đó lên GHCR.
  # Pull request: chỉ build + kiểm. Push master/develop: đẩy tag sha-<7> (bất biến, CD triển khai theo tag này) và tag nhánh.
  image:
    name: Docker Image (build, check, push GHCR)
    runs-on: ubuntu-latest
    needs: build-and-test
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build, check and push image
        env:
          GIT_SHA: ${{ github.sha }}
          BRANCH: ${{ github.head_ref || github.ref_name }}
        run: bash tools/ci/build-image.sh ghcr.io/nguyenthanhtrung-n2t/tadss-runtime ${{ github.event_name == 'push' && '--push' || '' }}

  # Epic 6C (6C-2b): CD — push develop/master ⇒ runner trên máy deploy kéo đúng image sha-<7> vừa đẩy, kiểm (đúng commit, health, smoke
  # chỉ đọc), hỏng thì tự quay về bản trước (SmashCourt-BE/deploy/cd.sh). Pull request không bao giờ chạy job này.
  deploy:
    name: Deploy (máy deploy)
    if: github.event_name == 'push'
    needs: image
    runs-on: [self-hosted, smashcourt-deploy]
    timeout-minutes: 15
    concurrency:
      group: deploy-tadss
      cancel-in-progress: false

    steps:
      - name: Get deploy kit (SmashCourt-BE/deploy, nhánh develop)
        uses: actions/checkout@v4
        with:
          repository: NguyenThanhTrung-N2T/SmashCourt-BE
          ref: develop
          sparse-checkout: deploy

      - name: Deploy, verify, roll back on failure
        env:
          SHA: ${{ github.sha }}
        run: bash deploy/cd.sh tadss "$SHA"

  # T5.30 (NG-1, NG-2, NG-3, NG-5, SEC-6): dựng docker-compose.yml thật với khóa ngẫu nhiên + PostgreSQL/Redis tạm, không mở tunnel ngrok và không dùng database ngoài
  expose-check:
    name: Verify Expose Configuration (docker-compose.yml)
    runs-on: ubuntu-latest
    needs: build-and-test

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Verify Expose Configuration
        run: bash tools/expose/verify-expose.sh

  # OB-2, OB-4 (O-23): dựng tadss-runtime + Grafana (otel-lgtm) thật với PostgreSQL/Redis tạm: dashboard TADSS được nạp và metric của TADSS tới Prometheus; không ngrok, không database ngoài
  observability-check:
    name: Verify Observability (dashboard + metrics)
    runs-on: ubuntu-latest
    needs: build-and-test

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Verify Observability
        run: bash tools/observability/verify-observability.sh

  # Công cụ của chế độ đánh giá (D-12): pytest của evaluator (và evidence khi có) và dựng thử image evaluator (không chạy). Test payload k6 cần binary k6.
  evaluation-tools:
    name: Evaluation Tools (pytest + evaluator image)
    runs-on: ubuntu-latest
    needs: build-and-test

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup k6
        uses: grafana/setup-k6-action@v1
        with:
          k6-version: "2.3.0"

      - name: Install Python Dependencies
        run: pip install -r tools/evaluation/requirements.txt -r tools/evidence/requirements.txt

      - name: Run Evaluator Tests
        run: |
          python -m pytest -q tools/evaluation
          python -m pytest -q tools/evidence

      - name: Build Evaluator Image (not run)
        run: docker build -f docker/evaluator/Dockerfile -t tadss-evaluator:ci .

  # DOC-1…DOC-3 (gói 5.7): bảng kiểm kê tài liệu, thuật ngữ đã gỡ trong tài liệu hiện hành, link nội bộ và anchor; chỉ dùng thư viện chuẩn của Python. DOC-4 là unit test .NET (job build-and-test).
  docs:
    name: Docs (DOC-1…DOC-3)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install pytest
        run: pip install pytest

      - name: Check Documentation
        run: python tools/docs/check_docs.py

      - name: Run Docs Tool Tests
        run: python -m pytest -q tools/docs

  # Epic 6C (gói 6C-3b, task 2.1–2.9): tests/catalog.yaml khớp methodology, 3 dashboard "Kiểm thử" khớp nguồn và mọi panel có mô tả 6 ý,
  # bộ nạp kết quả (trx, JUnit, Evidence Pack, k6, SC6, Playwright) đúng — không cần Docker.
  testboard:
    name: Testboard (catalog + dashboard Kiểm thử)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r perf/requirements.txt

      - name: Check catalog and dashboards
        run: python perf/board.py check

      - name: Run testboard and perf stack tests
        run: python -m pytest -q perf/testboard perf/stack
