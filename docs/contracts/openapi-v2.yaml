openapi: 3.0.1
info:
  title: TADSS Decision Runtime API
  description: 'Decision Runtime của TADSS cho SmashCourt: đánh giá quyết định đặt sân (POST /api/v2/decisions), tra cứu chi tiết quyết định (GET /api/v2/decisions/{decisionId}), hàng chờ duyệt (GET /api/v2/decisions/pending-approvals), Manager duyệt hoặc từ chối (POST /api/v2/decisions/{decisionId}/override) và ghi kết cục thực tế (POST /api/v2/decisions/{decisionId}/outcome). Contract v2: INTEGRATION_SPEC.'
  version: 2.0.0-draft
paths:
  /api/v2/decisions/pending-approvals:
    get:
      tags:
        - DecisionApprovals
      summary: Lấy một trang hàng chờ duyệt của chi nhánh (`GET /api/v2/decisions/pending-approvals`).
      parameters:
        - name: branchId
          in: query
          description: Chi nhánh cần lấy hàng chờ duyệt.
          required: true
          schema:
            type: string
            format: uuid
        - name: page
          in: query
          description: 'Số trang, bắt đầu từ 1.'
          schema:
            minimum: 1
            type: integer
            format: int32
            default: 1
        - name: pageSize
          in: query
          description: 'Số mục mỗi trang, 1..100.'
          schema:
            maximum: 100
            minimum: 1
            type: integer
            format: int32
            default: 20
        - name: X-Correlation-ID
          in: header
          description: Distributed tracing correlation ID (UUID or custom tracking string). Auto-generated by TADSS if omitted.
          schema:
            type: string
            example: 018e3a2b-8a71-7000-8c24-998877665544
      responses:
        '200':
          description: Trang hàng chờ duyệt.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PendingApprovalItemDtoPagedResult'
        '400':
          description: 'Thiếu `branchId`, giá trị không đọc được hoặc `page`/`pageSize` ngoài miền (`VALIDATION_ERROR`).'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '503':
          description: 'Lưu trữ tạm thời không khả dụng (`PERSISTENCE_UNAVAILABLE`), kèm `Retry-After`.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '500':
          description: Lỗi nội bộ (`INTERNAL_ERROR`).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  '/api/v2/decisions/{decisionId}/override':
    post:
      tags:
        - DecisionApprovals
      summary: "Manager duyệt hoặc từ chối một quyết định đang chờ duyệt (`POST /api/v2/decisions/{decisionId}/override`). Gửi lại cùng\n`X-Idempotency-Key` và cùng nội dung thì trả lại bản đã lưu."
      parameters:
        - name: decisionId
          in: path
          description: Định danh quyết định do runtime cấp.
          required: true
          schema:
            type: string
            format: uuid
        - name: X-Idempotency-Key
          in: header
          description: Unique client-generated operation key (UUID or string 1..128 chars) for idempotency and safe retry.
          required: true
          schema:
            maxLength: 128
            minLength: 1
            type: string
            example: req-booking-20260912-001
        - name: X-Actor-Id
          in: header
          description: Manager identifier (1..100 Unicode characters) taken by SmashCourt from the authenticated JWT.
          required: true
          schema:
            maxLength: 100
            minLength: 1
            type: string
            example: manager-01
        - name: X-Correlation-ID
          in: header
          description: Distributed tracing correlation ID (UUID or custom tracking string). Auto-generated by TADSS if omitted.
          schema:
            type: string
            example: 018e3a2b-8a71-7000-8c24-998877665544
      requestBody:
        description: Nội dung override (INTEGRATION_SPEC §3.6).
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OverrideRequestDto'
          text/json:
            schema:
              $ref: '#/components/schemas/OverrideRequestDto'
          application/*+json:
            schema:
              $ref: '#/components/schemas/OverrideRequestDto'
      responses:
        '200':
          description: 'Override (mới, hoặc bản đã lưu khi gửi lại cùng key và cùng nội dung).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OverrideResponseDto'
        '400':
          description: 'Thiếu/sai header, body sai hình thức hoặc mức cọc không hợp lệ với đơn (`MISSING_HEADER`, `VALIDATION_ERROR`).'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '404':
          description: 'Không có quyết định, hoặc đó là bản `SHADOW` (`DECISION_NOT_FOUND`).'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '409':
          description: 'Key đã dùng cho nội dung khác (`IDEMPOTENCY_KEY_REUSE`), đã có override khác (`ALREADY_OVERRIDDEN`), quyết định không còn chờ duyệt (`NOT_PENDING_APPROVAL`) hoặc hết hạn duyệt (`APPROVAL_EXPIRED`).'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '415':
          description: Content-Type không phải JSON (mặc định của MVC; không thuộc tập mã lỗi của contract).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '503':
          description: 'Lưu trữ tạm thời không khả dụng (`PERSISTENCE_UNAVAILABLE`), kèm `Retry-After`.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '500':
          description: Lỗi nội bộ (`INTERNAL_ERROR`).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  '/api/v2/decisions/{decisionId}/outcome':
    post:
      tags:
        - DecisionOutcomes
      summary: 'Ghi outcome của một quyết định (`POST /api/v2/decisions/{decisionId}/outcome`). Gửi lại cùng nội dung thì trả lại bản đã lưu.'
      parameters:
        - name: decisionId
          in: path
          description: Định danh quyết định do runtime cấp.
          required: true
          schema:
            type: string
            format: uuid
        - name: X-Idempotency-Key
          in: header
          description: Unique client-generated operation key (UUID or string 1..128 chars) for idempotency and safe retry.
          required: true
          schema:
            maxLength: 128
            minLength: 1
            type: string
            example: req-booking-20260912-001
        - name: X-Correlation-ID
          in: header
          description: Distributed tracing correlation ID (UUID or custom tracking string). Auto-generated by TADSS if omitted.
          schema:
            type: string
            example: 018e3a2b-8a71-7000-8c24-998877665544
      requestBody:
        description: Kết cục và thời điểm xảy ra (INTEGRATION_SPEC §3.7).
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OutcomeRequestDto'
          text/json:
            schema:
              $ref: '#/components/schemas/OutcomeRequestDto'
          application/*+json:
            schema:
              $ref: '#/components/schemas/OutcomeRequestDto'
      responses:
        '200':
          description: 'Outcome (mới, hoặc bản đã lưu khi gửi lại cùng nội dung).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OutcomeResponseDto'
        '400':
          description: 'Thiếu/sai `X-Idempotency-Key` hoặc body sai hình thức (`MISSING_HEADER`, `VALIDATION_ERROR`).'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '404':
          description: 'Không có quyết định, hoặc đó là bản `SHADOW` (`DECISION_NOT_FOUND`).'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '409':
          description: Đã có outcome với nội dung khác (`OUTCOME_ALREADY_RECORDED`).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '415':
          description: Content-Type không phải JSON (mặc định của MVC; không thuộc tập mã lỗi của contract).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '503':
          description: 'Lưu trữ tạm thời không khả dụng (`PERSISTENCE_UNAVAILABLE`), kèm `Retry-After`.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '500':
          description: Lỗi nội bộ (`INTERNAL_ERROR`).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /api/v2/decisions:
    post:
      tags:
        - Decisions
      summary: "Đánh giá một yêu cầu đặt sân (`POST /api/v2/decisions`). Gửi lại cùng `X-Idempotency-Key` và cùng nội dung thì trả\nlại đúng response đã lưu."
      parameters:
        - name: X-Idempotency-Key
          in: header
          description: Unique client-generated operation key (UUID or string 1..128 chars) for idempotency and safe retry.
          required: true
          schema:
            maxLength: 128
            minLength: 1
            type: string
            example: req-booking-20260912-001
        - name: X-Correlation-ID
          in: header
          description: Distributed tracing correlation ID (UUID or custom tracking string). Auto-generated by TADSS if omitted.
          schema:
            type: string
            example: 018e3a2b-8a71-7000-8c24-998877665544
      requestBody:
        description: Request v2 (INTEGRATION_SPEC §3.3).
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DecisionRequestDto'
          text/json:
            schema:
              $ref: '#/components/schemas/DecisionRequestDto'
          application/*+json:
            schema:
              $ref: '#/components/schemas/DecisionRequestDto'
      responses:
        '200':
          description: 'Quyết định (mới, hoặc bản đã lưu khi replay cùng key và cùng nội dung).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DecisionResultDto'
        '400':
          description: 'Thiếu/sai `X-Idempotency-Key`, body sai hình thức (`VALIDATION_ERROR`) hoặc vi phạm quy tắc domain.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '409':
          description: Key đã dùng cho request có nội dung khác (`IDEMPOTENCY_KEY_REUSE`).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '415':
          description: Content-Type không phải JSON (mặc định của MVC; không thuộc tập mã lỗi của contract).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '503':
          description: 'Không ghi được audit (`PERSISTENCE_UNAVAILABLE`), kèm `Retry-After`.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '504':
          description: 'Quá thời gian xử lý (`GATEWAY_TIMEOUT`), kèm `Retry-After`.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '500':
          description: Lỗi nội bộ (`INTERNAL_ERROR`).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  '/api/v2/decisions/{decisionId}':
    get:
      tags:
        - Decisions
      summary: 'Tra cứu chi tiết một quyết định đã lưu (`GET /api/v2/decisions/{decisionId}`), kèm override và outcome nếu có.'
      parameters:
        - name: decisionId
          in: path
          description: Định danh quyết định do runtime cấp.
          required: true
          schema:
            type: string
            format: uuid
        - name: X-Correlation-ID
          in: header
          description: Distributed tracing correlation ID (UUID or custom tracking string). Auto-generated by TADSS if omitted.
          schema:
            type: string
            example: 018e3a2b-8a71-7000-8c24-998877665544
      responses:
        '200':
          description: Chi tiết quyết định.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DecisionDetailDto'
        '404':
          description: Không có quyết định với decisionId (`DECISION_NOT_FOUND`).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '503':
          description: 'Lưu trữ tạm thời không khả dụng (`PERSISTENCE_UNAVAILABLE`), kèm `Retry-After`.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '500':
          description: Lỗi nội bộ (`INTERNAL_ERROR`).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
components:
  schemas:
    Channel:
      enum:
        - ONLINE
        - WALK_IN
      type: string
      description: "Kênh tạo booking (P-02) — trùng tên với `BookingSource` của SmashCourt-BE.\nTrên wire là chuỗi đúng tên thành viên; số, chuỗi số và chữ thường bị từ chối."
    CustomerDto:
      required:
        - isGuest
        - tier
      type: object
      properties:
        customerId:
          type: string
          description: 'Định danh khách; bắt buộc khi Shared.DecisionContractSDK.DTOs.Decisions.CustomerDto.IsGuest là `false`, `null` khi là khách vãng lai.'
          format: uuid
          nullable: true
        isGuest:
          type: boolean
          description: Khách vãng lai.
        tier:
          $ref: '#/components/schemas/CustomerTier'
        memberSince:
          type: string
          description: 'Thời điểm tạo tài khoản (tùy chọn, có offset); `null` với khách vãng lai.'
          format: date-time
          nullable: true
        history:
          $ref: '#/components/schemas/CustomerHistoryDto'
      additionalProperties: false
      description: Thông tin khách của request.
    CustomerHistoryDto:
      required:
        - cancelledCount
        - completedCount
        - noShowCount
      type: object
      properties:
        completedCount:
          type: integer
          description: Số booking đã hoàn tất.
          format: int32
        noShowCount:
          type: integer
          description: Số lần không đến.
          format: int32
        cancelledCount:
          type: integer
          description: Số lần khách tự hủy và được hoàn đủ.
          format: int32
        lateCancelledCount:
          type: integer
          description: 'Số lần hủy muộn (tùy chọn, mặc định 0).'
          format: int32
        paymentExpiredCount:
          type: integer
          description: 'Số lần hết hạn thanh toán (tùy chọn, mặc định 0).'
          format: int32
        lastCompletedAt:
          type: string
          description: 'Thời điểm hoàn tất gần nhất (tùy chọn, có offset).'
          format: date-time
          nullable: true
      additionalProperties: false
      description: Lịch sử đặt chỗ của khách (INTEGRATION_SPEC §3.3).
    CustomerTier:
      enum:
        - STANDARD
        - SILVER
        - GOLD
        - PLATINUM
        - DIAMOND
      type: string
      description: "Hạng thành viên chuẩn hóa; client ánh xạ hạng nội bộ theo thứ hạng (SmashCourt: `MinPoints` tăng dần).\nTrên wire là chuỗi đúng tên thành viên; số, chuỗi số và chữ thường bị từ chối."
    DecisionDetailDto:
      required:
        - correlationId
        - createdAt
        - decisionId
        - execution
        - outcome
        - override
        - request
        - reservationId
        - result
      type: object
      properties:
        decisionId:
          type: string
          description: Định danh quyết định.
          format: uuid
        reservationId:
          type: string
          description: Định danh đơn phía client.
          format: uuid
        request:
          $ref: '#/components/schemas/DecisionRequestDto'
        result:
          $ref: '#/components/schemas/DecisionDetailResultDto'
        execution:
          $ref: '#/components/schemas/ExecutionDetailDto'
        override:
          $ref: '#/components/schemas/OverrideResponseDto'
        outcome:
          $ref: '#/components/schemas/OutcomeResponseDto'
        createdAt:
          type: string
          description: Thời điểm ghi audit.
          format: date-time
        correlationId:
          type: string
          description: Correlation id của request đánh giá (nếu có).
          nullable: true
      additionalProperties: false
      description: 'Response `GET /api/v2/decisions/{decisionId}` (INTEGRATION_SPEC §3.4).'
    DecisionDetailResultDto:
      required:
        - approvalExpiresAt
        - deposit
        - reasonCode
        - reasons
        - recommendations
        - status
        - strategyStatus
      type: object
      properties:
        status:
          $ref: '#/components/schemas/DecisionStatus'
        strategyStatus:
          $ref: '#/components/schemas/DecisionStatus'
        deposit:
          $ref: '#/components/schemas/DepositDto'
        reasonCode:
          type: string
          description: Mã lý do.
          nullable: true
        reasons:
          type: array
          items:
            type: string
          description: Lý do cho người đọc.
          nullable: true
        recommendations:
          type: array
          items:
            $ref: '#/components/schemas/DecisionRecommendationDto'
          description: Khuyến nghị kèm theo.
          nullable: true
        approvalExpiresAt:
          type: string
          description: Hạn duyệt; chỉ có khi Shared.DecisionContractSDK.Enums.DecisionStatus.NEED_APPROVAL.
          format: date-time
          nullable: true
      additionalProperties: false
      description: 'Kết quả máy trong chi tiết quyết định, gồm trạng thái gốc của strategy.'
    DecisionOutcome:
      enum:
        - COMPLETED
        - NO_SHOW
        - CANCELLED_BY_CUSTOMER
        - CANCELLED_BY_STAFF
        - PAYMENT_EXPIRED
        - APPROVAL_EXPIRED
        - REJECTED
      type: string
      description: "Kết quả thực tế của booking, client báo về sau khi booking kết thúc (INTEGRATION_SPEC §2.3).\nTrên wire là chuỗi đúng tên thành viên; số, chuỗi số và chữ thường bị từ chối."
    DecisionRecommendationDto:
      required:
        - description
        - type
      type: object
      properties:
        type:
          $ref: '#/components/schemas/RecommendationType'
        description:
          type: string
          description: Mô tả cho người đọc.
          nullable: true
      additionalProperties: false
      description: 'Khuyến nghị kèm quyết định trên wire: `{ type, description }`.'
    DecisionRequestDto:
      required:
        - branchId
        - branchTimeZone
        - channel
        - currency
        - customer
        - items
        - requestedAt
        - reservationId
        - totalPrice
      type: object
      properties:
        reservationId:
          type: string
          description: Định danh đơn phía client.
          format: uuid
        branchId:
          type: string
          description: Định danh chi nhánh.
          format: uuid
        branchTimeZone:
          type: string
          description: Mã múi giờ IANA của chi nhánh.
          nullable: true
        items:
          type: array
          items:
            $ref: '#/components/schemas/ReservationItemDto'
          description: Các item (1..20).
          nullable: true
        customer:
          $ref: '#/components/schemas/CustomerDto'
        totalPrice:
          type: number
          description: Tổng tiền sau giảm giá.
          format: double
        currency:
          type: string
          description: Mã tiền tệ ISO 4217.
          nullable: true
        channel:
          $ref: '#/components/schemas/Channel'
        demand:
          $ref: '#/components/schemas/DemandDto'
        requestedAt:
          type: string
          description: Thời điểm client gửi yêu cầu (có offset).
          format: date-time
        metadata:
          type: object
          additionalProperties:
            type: string
          description: Metadata không ảnh hưởng quyết định (tùy chọn).
          nullable: true
      additionalProperties: false
      description: "Request `POST /api/v2/decisions` (INTEGRATION_SPEC §3.3). Thiếu trường bắt buộc, trường lạ, enum lạ\nhoặc thời gian thiếu offset làm deserialize thất bại (400 `VALIDATION_ERROR`)."
    DecisionResultDto:
      required:
        - approvalExpiresAt
        - decisionId
        - deposit
        - evaluatedAt
        - executionType
        - fallbackUsed
        - reasonCode
        - reasons
        - recommendations
        - reservationId
        - status
        - strategyName
        - strategyVersion
      type: object
      properties:
        decisionId:
          type: string
          description: Định danh quyết định do runtime cấp.
          format: uuid
        reservationId:
          type: string
          description: Định danh đơn phía client.
          format: uuid
        status:
          $ref: '#/components/schemas/DecisionStatus'
        deposit:
          $ref: '#/components/schemas/DepositDto'
        strategyName:
          type: string
          description: Tên strategy đã chạy.
          nullable: true
        strategyVersion:
          type: string
          description: Phiên bản strategy.
          nullable: true
        executionType:
          $ref: '#/components/schemas/ExecutionType'
        fallbackUsed:
          type: boolean
          description: Có dùng fallback.
        reasonCode:
          type: string
          description: Mã lý do.
          nullable: true
        reasons:
          type: array
          items:
            type: string
          description: Lý do cho người đọc.
          nullable: true
        recommendations:
          type: array
          items:
            $ref: '#/components/schemas/DecisionRecommendationDto'
          description: Khuyến nghị kèm theo.
          nullable: true
        approvalExpiresAt:
          type: string
          description: Hạn duyệt; chỉ có khi Shared.DecisionContractSDK.Enums.DecisionStatus.NEED_APPROVAL.
          format: date-time
          nullable: true
        evaluatedAt:
          type: string
          description: Thời điểm đánh giá.
          format: date-time
      additionalProperties: false
      description: "Response 200 của `POST /api/v2/decisions` (INTEGRATION_SPEC §3.3).\nShared.DecisionContractSDK.DTOs.Decisions.DecisionResultDto.Deposit có ⇔ Shared.DecisionContractSDK.Enums.DecisionStatus.APPROVED; Shared.DecisionContractSDK.DTOs.Decisions.DecisionResultDto.ApprovalExpiresAt có ⇔\nShared.DecisionContractSDK.Enums.DecisionStatus.NEED_APPROVAL (INV-7). Hai trường này luôn xuất hiện trên wire, có thể là `null`."
    DecisionStatus:
      enum:
        - APPROVED
        - NEED_APPROVAL
        - REJECTED
      type: string
      description: "Trạng thái quyết định trả cho client (INTEGRATION_SPEC §3.3).\nTrên wire là chuỗi đúng tên thành viên; số, chuỗi số và chữ thường bị từ chối."
