        amount:
          type: number
          description: Số tiền cọc.
          format: double
        currency:
          type: string
          description: Mã tiền tệ ISO 4217.
          nullable: true
      additionalProperties: false
      description: 'Mức cọc đã quy đổi: `amount = round(totalPrice × rate)` theo số chữ số thập phân của tiền tệ.'
    ExecutionDetailDto:
      required:
        - cacheHit
