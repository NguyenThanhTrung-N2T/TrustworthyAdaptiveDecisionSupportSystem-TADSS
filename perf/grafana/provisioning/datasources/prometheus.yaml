# Datasource của dashboard "Kiểm thử" (uid cố định "prometheus": JSON trong perf/grafana/dashboards trỏ vào uid này)
apiVersion: 1
datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false
  # Trace của lượt phân tích (perf.sh up --trace): Explore ⇒ Tempo, tìm theo service.name (smashcourt-be, tadss-runtime, smashcourt-ai)
  - name: Tempo
    uid: tempo
    type: tempo
    access: proxy
    url: http://tempo:3200
    editable: false
    jsonData:
      tracesToMetrics:
        datasourceUid: prometheus
